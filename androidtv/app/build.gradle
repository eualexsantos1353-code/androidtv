// The formatting is rough and I'm not going to bother. Pull requests that fix it are welcome; complaints without one help neither me nor the end user.
plugins {
    id 'com.android.application'
}

/* the app's names in one place (the rename changes them here and in src/platform/androidtv/atv.h) */
def APP_ID = 'app.stremioorigin.tv'

def keyProps = new Properties()
def keyPropsFile = new File(System.getProperty('user.home'), 'origin-build/android/keys/tv.properties')
def hasKeys = keyPropsFile.exists()
if (hasKeys) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

android {
    namespace APP_ID
    compileSdk 36

    defaultConfig {
        applicationId APP_ID
        minSdk 21
        targetSdk 35
        /* the version is the TV app's (pkg/appinfo.json): one train for every platform */
        def ver = System.getenv('SB_VERSION') ?: new groovy.json.JsonSlurper().parse(file('../../pkg/appinfo.json')).version   /* SB_VERSION=1.0.9: a test build numbered below the release (the update flow) */
        def p = ver.tokenize('.').collect { it as int }
        versionName ver
        versionCode p[0] * 10000 + p[1] * 100 + p[2]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {   /* one fixed key committed with the fork: every debug build installs over the last one */
            storeFile file('origin-debug.keystore')
            storePassword 'android'
            keyAlias 'origin'
            keyPassword 'android'
        }
        if (hasKeys) {
            release {
                storeFile file(keyProps.getProperty('storeFile'))
                storePassword keyProps.getProperty('storePassword')
                keyAlias keyProps.getProperty('keyAlias')
                keyPassword keyProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug { resValue 'bool', 'dev_hooks', 'true'; signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            resValue 'bool', 'dev_hooks', System.getenv('SB_DEVHOOKS') == '1' ? 'true' : 'false'   /* SB_DEVHOOKS=1: a release-signed TEST build that takes test settings (never published) */
            if (hasKeys) {
                signingConfig signingConfigs.release
            }
        }
    }

    /* ONE APK for every Android TV: both library sets inside (lib/arm64-v8a, lib/armeabi-v7a), Android installs the
       one the device runs (most streamers run a 32-bit Android, even on 64-bit chips). No ABI splits */
    defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true   /* the libraries unpacked on install: the torrent engine is opened by its file name */
        }
    }
}

dependencies {
    /* the player: Media3 (ExoPlayer), Apache 2.0, with HLS and DASH, and its subtitle view for text tracks in the file */
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    /* YouTube's picture files are tied to the IPv4 address that asked for them: the pieces go over OkHttp, IPv4 only */
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    /* DTS, TrueHD, AC-3/E-AC-3 and more decoded in the app when the box cannot pass them through (FFmpeg, built by Jellyfin) */
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
}
